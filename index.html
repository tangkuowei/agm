<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c55">
<title>區權會報到系統</title>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--pri:#0f5c55;--pri2:#e6f2f0;--bg:#f4f5f2;--ink:#1d2321;--mute:#6b7572;--line:#d9ddd9;--warn:#b54708;--bad:#b42318;--ok:#067647}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.wide{max-width:980px}
.hero{background:var(--pri);color:#fff;padding:22px 18px 18px;border-radius:0 0 18px 18px;margin:-16px -14px 16px}
.hero h1{font-size:21px;margin:0 0 4px;line-height:1.35}
.hero p{margin:0;opacity:.85;font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:17px}
.inp:focus{outline:none;border-color:var(--pri)}
label.f{display:block;font-size:14px;color:var(--mute);margin:12px 0 6px}
.list{margin-top:10px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.list button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;font-size:16px}
.list button:last-child{border-bottom:0}
.list button:disabled{color:#a0a8a5;background:#fafafa}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#eef0ee;color:var(--mute);white-space:nowrap}
.tag.ok{background:#dcf5e5;color:var(--ok)}
.tag.px{background:#fff1e0;color:var(--warn)}
.chosen{display:flex;justify-content:space-between;align-items:center;background:var(--pri2);border-radius:10px;padding:12px 14px;font-size:18px;font-weight:600}
.link{background:none;border:0;color:var(--pri);text-decoration:underline;font-size:15px;padding:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:15px 10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:17px;font-weight:600}
.opt.on{border-color:var(--pri);background:var(--pri2);color:var(--pri)}
.rel{display:grid;gap:8px;margin-top:12px}
.rel .opt{text-align:left;font-weight:500;font-size:16px;padding:13px 14px}
.hint{font-size:14px;color:var(--mute);margin:10px 0 0}
.sigbox{position:relative;border:1.5px dashed #9aa5a1;border-radius:12px;background:#fff;touch-action:none}
.sigbox canvas{display:block;width:100%;height:210px;touch-action:none;border-radius:12px}
.sigbox .ph{position:absolute;inset:0;display:grid;place-items:center;color:#b6bdba;font-size:20px;pointer-events:none}
.sigbox .base{position:absolute;left:18px;right:18px;bottom:46px;border-bottom:1px solid #e3e6e4;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:8px}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.bad{color:var(--bad);border-color:#f3c4bf}
.btn.big{width:100%;padding:16px;font-size:18px;border-radius:12px}
.btn:disabled{opacity:.5}
.err{background:#fef3f2;color:var(--bad);border:1px solid #fecdca;border-radius:10px;padding:10px 12px;font-size:15px;margin-bottom:12px}
.demo{background:#fffaeb;border:1px solid #fedf89;color:#93370d;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.done{text-align:center;padding:30px 10px}
.done .ic{width:76px;height:76px;border-radius:50%;background:#dcf5e5;color:var(--ok);display:grid;place-items:center;font-size:42px;margin:0 auto 14px}
.done h2{justify-content:center;font-size:22px}
.foot{text-align:center;margin-top:26px}
.foot a{color:#a0a8a5;font-size:13px}
/* 電腦大螢幕 */
@media(min-width:900px){ .wrap.wide{max-width:1240px;padding:20px 28px 40px} .wrap.wide .hero{margin:0 0 16px;border-radius:16px} .tabs{flex-wrap:wrap} }
@media(min-width:1100px){ .livegrid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start} .livegrid .card:first-child,.livegrid>div>#live>.stats{margin-top:0} .livegrid>div>.card:first-child{margin-top:0!important} .livegrid .stats{grid-template-columns:repeat(2,1fr)} .livegrid .stat b{font-size:30px} }
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:14px;cursor:pointer}.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* ===== 投影畫面 ===== */
body.showmode{background:#f4f6f4;overflow:hidden}
.show{position:fixed;inset:0;display:flex;flex-direction:column;background:#f4f6f4;color:#14201d}
.show header{display:flex;justify-content:space-between;align-items:center;gap:2vw;background:#0f5c55;color:#fff;padding:1.6vh 3vw;font-size:clamp(14px,1.7vw,40px)}
.show main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:3vh 4vw 7vh}
.s-sub{font-size:clamp(14px,1.8vw,40px);color:#4d5b57;font-weight:600}
.s-title{font-size:clamp(24px,4vw,88px);font-weight:800;line-height:1.2;margin:.6vh 0 1.2vh}
.s-desc{font-size:clamp(14px,1.7vw,36px);color:#4d5b57;margin-top:-.4vh}
.s-meta{font-size:clamp(14px,1.9vw,40px);margin-bottom:2vh}.s-live{color:#067647;font-weight:700}.s-warn{color:#b54708;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;margin-top:3vh}
.kpi{background:#fff;border-radius:2vh;padding:3vh 2vw;box-shadow:0 .3vh 1.2vh rgba(0,0,0,.06)}
.kl{font-size:clamp(14px,1.8vw,40px);color:#4d5b57}.kv{font-size:clamp(36px,7vw,170px);font-weight:800;line-height:1.1;margin:1vh 0}.kv small{font-size:.38em;color:#4d5b57;font-weight:600}
.kb{height:1.6vh;background:#e4e8e6;border-radius:9px;overflow:hidden}.kb i{display:block;height:100%;background:#0f5c55}.ks{font-size:clamp(13px,1.5vw,32px);color:#4d5b57;margin-top:1.2vh}
.vbig{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;margin-top:2vh}
.vb{border-radius:2vh;padding:2.4vh 1.5vw;text-align:center}.vb span{display:block;font-size:clamp(16px,2.2vw,48px);font-weight:700}
.vb b{display:block;font-size:clamp(36px,7vw,160px);line-height:1.1;margin:.5vh 0}.vb em{font-style:normal;font-size:clamp(13px,1.6vw,34px)}
.vb.y{background:#dff6e8;color:#05603a}.vb.n{background:#fde4e1;color:#b42318}.vb.u{background:#e9ecea;color:#4d5b57}
.sbar{position:relative;display:flex;height:2.4vh;border-radius:99px;background:#e4e8e6;overflow:visible;margin:3vh 0 2.4vh}
.sbar .y{background:#12b76a;border-radius:99px 0 0 99px}.sbar .n{background:#f04438}.sbar .th{position:absolute;top:-1vh;bottom:-1vh;width:.35vw;min-width:3px;background:#14201d;border-radius:2px}
.sbar .th em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:clamp(11px,1.1vw,24px);font-weight:700;color:#14201d;margin-bottom:.3vh}
.verd{text-align:center;font-size:clamp(24px,4.4vw,100px);font-weight:800;border-radius:2vh;padding:1.6vh 0}.verd small{font-size:.42em;font-weight:600}
.verd.ok{background:#12b76a;color:#fff}.verd.bad{background:#d92d20;color:#fff}.verd.live{background:#fff;color:#067647;border:.4vh solid #12b76a}.verd.wait{background:#e9ecea;color:#4d5b57}
.s-foot{text-align:center;font-size:clamp(13px,1.5vw,32px);color:#4d5b57;margin-top:2vh}
.rank{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;gap:1.1vh 2vw}
.rank li{display:grid;grid-template-columns:1.8em minmax(0,1fr) auto 2.4em;align-items:center;gap:.5em;background:#fff;border-radius:1.2vh;padding:.45em .7em;box-shadow:0 .2vh .8vh rgba(0,0,0,.05);line-height:1.3;min-width:0}
.s-compact .s-title{font-size:clamp(20px,3vw,64px);margin:.3vh 0 .6vh}.s-compact .s-sub,.s-compact .s-meta{font-size:clamp(13px,1.5vw,32px)}.s-compact .s-meta{margin-bottom:1.4vh}
.rank li.win{border-left:.5vw solid #12b76a}.rank li.tie{border-left:.5vw solid #f79009;background:#fffaeb}
.rank .rk{font-weight:800;color:#0f5c55;text-align:center}.rank .rn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank .rn small{font-weight:500;color:#4d5b57;margin-left:.6em;font-size:.7em}
.rank .rv{font-weight:800}.rank .rt2{font-size:.7em;font-weight:700;color:#067647;text-align:right}.rank li.tie .rt2{color:#b54708}
.snav{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px;background:rgba(20,32,29,.85);opacity:0;transition:.3s}
body.navon .snav,.snav:hover{opacity:1}.snav button{padding:8px 14px;border-radius:99px;border:0;background:#2c3c38;color:#fff;font-size:14px;cursor:pointer}.snav button.on{background:#12b76a}.snav .snote{color:#cfd8d5;font-size:13px;align-self:center;margin-left:8px}
/* vote */
.topic{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.topic .tt{font-size:17px;font-weight:700;line-height:1.4}
.vbtn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.vbtn button{padding:16px 8px;border-radius:12px;font-size:19px;font-weight:700;border:2px solid}
.vy{background:#ecfdf3;color:var(--ok);border-color:#a6e9c0!important}.vn{background:#fef3f2;color:var(--bad);border-color:#fdc9c4!important}
.voted{margin-top:12px;padding:12px;border-radius:10px;font-weight:700;text-align:center;font-size:17px}
.voted.y{background:#ecfdf3;color:var(--ok)}
.list button.pk{background:var(--pri2);color:var(--pri);font-weight:600}.voted.n{background:#fef3f2;color:var(--bad)}
/* admin */
.vbar{display:flex;height:10px;border-radius:9px;background:#eef0ee;overflow:hidden;margin:14px 0 8px}.vbar .y{background:#12b76a}.vbar .n{background:#f04438}
.tb.vt td,.tb.vt th{padding:7px 6px}.tb.vt .hl{background:#eef7f5;font-weight:700}
.passrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-top:12px;font-size:14px;color:var(--mute)}
.passrow select{padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:15px;color:var(--ink);font-weight:600}
.verdict{border-radius:10px;padding:10px 12px;margin-top:4px;display:flex;flex-direction:column;gap:2px}
.verdict b{font-size:20px}.verdict span{font-size:13px}
.verdict.ok{background:#12b76a;color:#fff}.verdict.bad{background:#d92d20;color:#fff}
.verdict.pend{background:#f2f4f3;color:var(--mute)}.verdict.pend b{font-size:16px}.verdict.pend.ok{background:#ecfdf3;color:var(--ok)}
.vres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.vk{border-radius:10px;padding:8px 10px;text-align:center}.vk span{display:block;font-size:13px}.vk b{display:block;font-size:22px;margin:2px 0}.vk small{font-size:12px;color:var(--mute)}
.vk.y{background:#ecfdf3;color:var(--ok)}.vk.n{background:#fef3f2;color:var(--bad)}.vk.u{background:#f2f4f3;color:var(--mute)}
.ck{display:flex;align-items:center;gap:8px;font-size:15px;margin:6px 0}.ck input{width:18px;height:18px}
.btn.sm{padding:8px 14px;font-size:14px}
.vc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.vcn{min-width:0;font-weight:600;font-size:15px;line-height:1.4}
.drow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}.dn{min-width:0}.dn b{font-size:15px}.dn small{display:block;color:var(--mute);font-size:12px;margin-top:2px}.dnote{font-size:13px;color:#344;margin-top:4px;line-height:1.45}
.tag.bad{background:#fef3f2;color:var(--bad)}
.gchk{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:15px}.gchk label{display:flex;align-items:center;gap:6px}.gchk input{width:18px;height:18px}
.tb tr.win td{background:#f0faf6}
.tb.rk td,.tb.rk th{padding:8px 5px;font-size:13px}.tb.rk td.nm{white-space:normal;min-width:90px;font-size:14px}.tb.rk small{display:block;color:var(--mute);font-size:12px}
.grp{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff1e0;color:#93370d;border-radius:99px;padding:4px 4px 4px 10px;margin:3px 4px 3px 0;font-size:14px}
.chip button{border:0;background:rgba(0,0,0,.08);border-radius:50%;width:22px;height:22px;line-height:20px;font-size:15px;padding:0;cursor:pointer}
.warnbox{background:#fffaeb;border:1px solid #fedf89;color:#93370d;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{flex:none;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:15px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;margin-top:2px}
.stat span{font-size:13px;color:var(--mute)}
.bar{height:6px;background:#eef0ee;border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th,.tb td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tb th{color:var(--mute);font-weight:500;font-size:13px;background:#fafbfa;position:sticky;top:0}
.tb img{height:30px;max-width:80px;object-fit:contain}
.scroll{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.filters{display:flex;gap:8px;margin:12px 0}
.filters .inp{padding:9px 12px;font-size:15px;flex:1;min-width:0}
.filters select,.filters .btn{flex:none}
.tb td{white-space:nowrap}
.filters select{padding:9px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.grid2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.qr{display:grid;place-items:center;padding:10px}
.qr img{width:240px;height:240px;image-rendering:pixelated}
.url{word-break:break-all;font-size:13px;color:var(--mute);background:#fafbfa;border-radius:8px;padding:8px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2321;color:#fff;padding:11px 18px;border-radius:99px;font-size:15px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== 簽到表（比照 Word 模板）===== */
#pv{position:fixed;inset:0;background:#6b7572;z-index:50;overflow:auto}
#pv .bar2{position:sticky;top:0;z-index:2;display:flex;gap:8px;justify-content:center;padding:10px;background:#1d2321}
#pv .pages{padding:14px 0 40px;zoom:var(--z,1)}
.page{width:210mm;height:296.5mm;margin:0 auto 14px;background:#fff;padding:10mm 18.5mm 6mm;position:relative;overflow:hidden;
  font-family:"PMingLiU","MingLiU","新細明體","Noto Serif TC","Noto Serif CJK TC","Songti TC","Source Han Serif TC",serif;color:#000}
.page .ttl{text-align:center;font-size:16pt;margin:0 0 1.5mm;letter-spacing:.5pt}
.page .dt{text-align:right;font-size:11pt;margin:0 0 1.5mm}
.page .pn{position:absolute;right:18.5mm;bottom:6mm;font-size:10pt}
.sheet{width:100%;border-collapse:collapse;table-layout:fixed;border:1.5pt solid #000}
.sheet th,.sheet td{border:.75pt solid #000;text-align:center;vertical-align:middle;padding:0 1mm;font-weight:normal}
.sheet th{height:10mm;font-size:11pt;line-height:1.25}
.sheet td{height:17.5mm;font-size:11pt;line-height:1.3;word-break:break-all}
.sheet td.sig{padding:.6mm}
.sheet td.sig img{max-width:100%;max-height:16mm;display:block;margin:0 auto}
.sheet td.att{font-size:10.5pt;white-space:nowrap;padding:0}
.sheet td.rl{text-align:left;font-size:9pt;line-height:1.36;padding:0 .8mm}
.sheet td.rl div{text-decoration:underline;white-space:nowrap}
.sheet td.rt{font-size:10.5pt}
.cb{display:inline-block;width:2.9mm;height:2.9mm;border:.6pt solid #000;vertical-align:-.3mm;margin-right:.3mm;position:relative;text-decoration:none}
.cb.on::after{content:"";position:absolute;left:.75mm;top:-.15mm;width:.95mm;height:2mm;border:solid #000;border-width:0 .5mm .5mm 0;transform:rotate(45deg)}
.sum{width:100%;border-collapse:collapse;margin-top:5mm;border:1.5pt solid #000;font-size:11pt}
.sum th,.sum td{border:.75pt solid #000;padding:2mm 2mm;height:9mm;font-weight:normal}
.sum th{background:#f2f2f2;width:24%}
.sum td{width:26%;text-align:center}
.sheet td.rm{font-size:8.5pt;line-height:1.3}
.page.rpt{padding:10mm 15mm 6mm}
.rt{width:100%;border-collapse:collapse;table-layout:fixed;border:1.2pt solid #000;margin-bottom:0}
.rt th,.rt td{border:.6pt solid #000;padding:.6mm 1mm;text-align:center;vertical-align:middle;font-size:9.5pt;line-height:1.3;font-weight:normal;overflow:hidden}
.rt th{background:#eee}.rt td.l{text-align:left}.rt td.nw{white-space:nowrap;text-overflow:ellipsis}.rt .sm{font-size:8.5pt;color:#333}
.rt tr.w td{background:#eef7f1}.rt b.ok,.note.ok{color:#05603a}.rt b.bad,.note.bad{color:#b42318}
.rs{width:100%;border-collapse:collapse;font-size:10pt;margin-bottom:4mm}.rs th,.rs td{border:.6pt solid #000;padding:1mm 2mm;text-align:left;font-weight:normal}.rs th{width:18%;background:#eee}
.rcont{font-size:9pt;color:#333;height:6mm}.ecap{font-size:10pt;line-height:1.45;margin-bottom:1.5mm}
.sgn{display:flex;justify-content:space-between;margin-top:12mm;font-size:11pt}.sgn span{width:30%;border-bottom:.6pt solid #000;padding-bottom:6mm}
.page .note{font-size:9pt;margin-top:2mm;color:#333}
.poster{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%}
.poster h1{font-size:28pt;margin:0 0 4mm}
.poster h2{font-size:20pt;margin:0 0 10mm;font-weight:normal}
.poster img{width:120mm;height:120mm;image-rendering:pixelated}
.poster p{font-size:15pt;margin:8mm 0 0}
.page.qp{padding:8mm 9mm;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:0}
.qc{border:.5pt dashed #999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2mm;overflow:hidden;font-family:-apple-system,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif}
.qc1{font-size:10.5pt;font-weight:700}.qc2{font-size:8.5pt;color:#444;margin-bottom:1.2mm}
.qc3{font-size:13pt;font-weight:700;border:1pt solid #000;border-radius:1.5mm;padding:.6mm 3mm;margin-bottom:1mm;max-width:100%;line-height:1.25}
.qc3.long{font-size:10pt;padding:.6mm 2mm}
.qc img{width:33mm;height:33mm;image-rendering:pixelated}.qc4{font-size:8.5pt;margin-top:.8mm}.qc5{font-size:7.5pt;color:#444;line-height:1.35;margin-top:.6mm}
@page{size:A4 portrait;margin:0}

  html,body{background:#fff}
  body>*:not(#pv){display:none!important}
  #pv{position:static;background:#fff;overflow:visible}
  #pv .bar2{display:none}
  #pv .pages{padding:0;zoom:1}
  .page{margin:0;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}

}

<body>
<div id="app"><div class="wrap" style="text-align:center;padding-top:80px;color:#6b7572"><span class="spin"></span></div></div>
<div id="pv" hidden><div class="bar2"><button class="btn pri" onclick="window.print()">列印 / 存成 PDF</button><button class="btn" onclick="closePV()">關閉</button></div><div class="pages" id="pages"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   設定：部署 Google Apps Script 後，把「網頁應用程式網址」貼在下面
   留空 = 示範模式（資料只存在目前這支手機 / 這台電腦的瀏覽器）
   ================================================================ */
const API_URL = '';

const DEMO = !API_URL;
const REL = ['配偶','有行為能力之直系血親','其他區分所有權人','承租人'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
const PAGE = params.get('p') === 'admin' ? 'admin' : params.get('p') === 'show' ? 'show' : 'checkin';

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200); }
function rocDate(d){ if(!d) return '　　年　　月　　日'; const m=String(d).match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/); if(!m) return d; return `${+m[1]-1911}年${m[2].padStart(2,'0')}月${m[3].padStart(2,'0')}日`; }
function hhmm(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return iso; return d.toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}); }
function natCmp(a,b){ const x=String(a).match(/\d+|\D+/g)||[], y=String(b).match(/\d+|\D+/g)||[];
  for(let i=0;i<Math.min(x.length,y.length);i++){ const p=x[i], q=y[i]; if(p===q) continue; const n1=/^\d/.test(p), n2=/^\d/.test(q); if(n1&&n2) return (+p)-(+q)||p.length-q.length; return p<q?-1:1; } return x.length-y.length; }
const r4=v=>Math.round(v*1e4)/1e4;
function num(s){ const v=parseFloat(String(s).replace(/,/g,'')); return isNaN(v)?0:v; }
function fmtNum(v){ return String(Math.round(v*10000)/10000); }
const DEF_MEETING='區分所有權人會議';
const mtg = c => (c&&c.meeting)||DEF_MEETING;
const sheetTitle = c => (c&&c.title) ? c.title : `${c.name||''}${mtg(c)}出席人員名冊（簽到簿）`;
function pct(a,b){ return b>0 ? (a/b*100).toFixed(2)+'%' : '—'; }

/* ---------------- 資料層：示範模式（localStorage）---------------- */
const LS = 'agm_checkin_v1';
function dbLoad(){ try{ const d=JSON.parse(localStorage.getItem(LS)); if(d&&d.config) return d; }catch(e){} return {config:{name:'',meeting:'',title:'',date:'',denom:'',adminPwd:'1234'},residents:[],checkins:{}}; }
function dbSave(d){ try{ localStorage.setItem(LS, JSON.stringify(d)); }catch(e){ throw new Error('瀏覽器儲存空間不足'); } }
const TK_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newToken(){ const a=new Uint32Array(8); crypto.getRandomValues(a); return Array.from(a,x=>TK_ABC[x%32]).join(''); }
function giveTokens(list, old){ const used=new Set(); const keep={}; (old||[]).forEach(r=>{ if(r.token) keep[r.seq]=r.token; });
  return list.map(r=>{ let t=keep[r.seq]; if(!t||used.has(t)){ do{ t=newToken(); }while(used.has(t)); } used.add(t); return {...r, token:t}; }); }
const voteBy = c => (c&&c.voteBy)==='count' ? 'count' : 'ratio';
const VB_TXT={ratio:'依區分所有權比例',count:'依戶數'};
// 通過門檻：例「過半數」「三分之二以上」「四分之三以上」「60%以上」「超過60%」
const PASS_DEF='過半數', PASS_PRESETS=['過半數','三分之二以上','四分之三以上'];
function parsePass(s){ s=String(s||'').replace(/\s/g,''); if(!s) s=PASS_DEF;
  const cn=[['二分之一',1/2],['三分之二',2/3],['四分之三',3/4],['三分之一',1/3],['五分之四',4/5],['五分之三',3/5]];
  let f=null; const gt=/過半|超過|大於|>/.test(s) && !/以上|≥|>=/.test(s);
  if(/過半/.test(s)) f=1/2; else { const c=cn.find(([k])=>s.includes(k)); if(c) f=c[1];
    else { let m=s.match(/(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)/); if(m) f=+m[1]/+m[2]; else if((m=s.match(/(\d+(?:\.\d+)?)/))) f=+m[1]/100; } }
  if(f===null||!(f>0&&f<=1)) return null;
  return {gt:/過半/.test(s)?true:gt, f, label:passLabel(/過半/.test(s)?true:gt,f)}; }
function passLabel(gt,f){ const near=x=>Math.abs(f-x)<1e-6;
  if(gt&&near(1/2)) return '過半數';
  const c=[['二分之一',1/2],['三分之二',2/3],['四分之三',3/4]].find(([,v])=>near(v));
  const n=c?c[0]:`${+(f*100).toFixed(2)}%`; return gt?`超過${n}`:`${n}以上`; }
function judge(T,t,vb){ const p=parsePass(t.pass)||parsePass(PASS_DEF), R=vb==='ratio', y=R?T.yr:T.y, att=R?T.attR:T.attN, r=att?y/att:0;
  return {p, r, ok: att>0 && (p.gt ? r>p.f+1e-9 : r>=p.f-1e-9)}; }
function buildShowData(D){ const c=D.config, st=stats(D);
  return {name:c.name||'', meeting:c.meeting||'', date:c.date||'', open:!!c.open, voteBy:voteBy(c), view:c.showView||'auto',
    att:{total:st.total, att:st.att, self:st.self, proxy:st.proxy, sumAtt:r4(st.sumAtt), denom:r4(st.denom), denomStr:st.denomStr},
    topics:(D.topics||[]).map(t=>{ const x=tally(t.id,D); return {id:t.id,title:t.title,desc:t.desc||'',status:t.status,pass:t.pass||'',
      y:x.y,yr:r4(x.yr),n:x.n,nr:r4(x.nr),uN:x.uN,uR:r4(x.uR),attN:x.attN,attR:r4(x.attR),total:x.total,denom:r4(x.denom)}; }),
    elections:(D.elections||[]).map(e=>{ const x=etally(e,D); return {id:e.id,name:e.name,groups:e.groups,maxVotes:e.maxVotes,top:e.top,status:e.status,sort:e.sort,
      nv:x.nv,elig:x.elig,tie:x.tie,list:x.list.filter(y=>y.res).map(y=>({rank:y.rank,seq:y.c.seq,name:y.c.name,group:y.c.group||'',v:y.v,r:r4(y.r),res:y.res}))}; }) }; }
const ckMode = c => (c&&c.mode)==='shared' ? 'shared' : 'personal';
const PROXY_REL='其他區分所有權人';
function checkDelegates(list){ const by={}; list.forEach(r=>by[r.seq]=r); const err=[];
  list.forEach(r=>{ if(!r.delegate) return; const d=by[r.delegate];
    if(!d) err.push(`${r.seq} 的受託戶「${r.delegate}」不在名冊中`); else if(d.seq===r.seq) err.push(`${r.seq} 不能委託給自己`);
    else if(d.delegate) err.push(`${r.seq} 的受託戶 ${d.seq} 本身也委託了別人，受託戶不能再委託出去`); });
  if(err.length) throw new Error('受託戶設定有誤：\n'+err.slice(0,8).join('\n')); }
function demoCall(action, p){
  const db = dbLoad(); db.topics=db.topics||[]; db.votes=db.votes||{}; db.elections=db.elections||[]; db.evotes=db.evotes||{};
  const cm=ckMode(db.config), R=db.residents, C=db.checkins, now=()=>new Date().toISOString();
  const bySeq=s=>R.find(x=>x.seq===s), principalsOf=s=>R.filter(x=>x.delegate===s);
  const byTok=t=>{ const r=R.find(x=>x.token===t); if(!r) throw new Error('這個 QR Code 無效或已經停用，請洽報到處'); return r; };
  const dropVotes=seqs=>[db.votes,db.evotes].forEach(B=>Object.values(B).forEach(V=>seqs.forEach(s=>delete V[s])));
  const inG=(h,e)=>!e.groups.length||e.groups.includes(h.group||'');
  const mine=r=>[r,...principalsOf(r.seq).filter(x=>C[x.seq]&&C[x.seq].via===r.seq)];
  const myEl=r=>!C[r.seq]?[]:db.elections.filter(e=>e.status==='open').map(e=>{ const elig=mine(r).filter(h=>inG(h,e)); if(!elig.length) return null;
    const V=db.evotes[e.id]||{}, left=elig.filter(h=>!V[h.seq]), done=elig.find(h=>V[h.seq]);
    return {id:e.id,name:e.name,groups:e.groups,maxVotes:e.maxVotes,weight:left.length,total:elig.length,picks:left.length?null:V[done.seq].picks,
      candidates:R.filter(h=>inG(h,e)).map(h=>({seq:h.seq,name:h.name,group:h.group||''}))}; }).filter(Boolean);
  const findEl=id=>{ const e=db.elections.find(x=>x.id===String(id)); if(!e) throw new Error('找不到這場選舉'); return e; };
  if(action==='public'){
    const o={name:db.config.name, meeting:db.config.meeting||'', date:db.config.date, mode:cm, open:!!db.config.open, count:R.length,
      topics:db.topics.filter(t=>t.status==='open').map(({id,title,desc})=>({id,title,desc}))};
    if(p.t){ const r=byTok(p.t), d=r.delegate?bySeq(r.delegate):null, votes={};
      db.topics.forEach(t=>{ const v=(db.votes[t.id]||{})[r.seq]; if(v) votes[t.id]=v.v; });
      o.me={seq:r.seq,name:r.name,done:!!C[r.seq],delegate:d?{seq:d.seq,name:d.name}:null,principals:principalsOf(r.seq).map(x=>({seq:x.seq,name:x.name,done:!!C[x.seq]})),votes,elections:myEl(r)}; }
    else if(cm==='shared') o.residents=R.map(r=>({seq:r.seq,name:r.name,done:!!C[r.seq],delegate:r.delegate||''}));
    return o; }
  if(action==='checkin'){
    if(!db.config.open) throw new Error('目前未開放報到，請依現場工作人員指示');
    if(p.t) p.seq=byTok(p.t).seq; else if(cm==='personal') throw new Error('請掃描您家專屬的 QR Code 報到');
    const r=bySeq(p.seq); if(!r) throw new Error('找不到這個序號，請重新選擇');
    if(r.delegate) throw new Error(`本戶已委託 ${r.delegate} 出席，報到由受託人辦理`);
    if(C[r.seq]) throw new Error(`${r.seq} ${r.name} 已經完成報到，如需更正請洽報到處`);
    if(p.mode!=='本人' && p.mode!=='委託') throw new Error('請選擇「是否委託出席」');
    if(p.mode==='委託' && !REL.includes(p.rel)) throw new Error('請選擇「委託關係」');
    if(!/^data:image\/png;base64,/.test(p.sig||'')) throw new Error('請先簽名');
    const time=now(); C[r.seq]={mode:p.mode, rel:p.mode==='委託'?p.rel:'', sig:p.sig, time, via:''}; let n=0;
    principalsOf(r.seq).forEach(x=>{ if(!C[x.seq]){ C[x.seq]={mode:'委託',rel:PROXY_REL,sig:p.sig,time,via:r.seq}; n++; } });
    dbSave(db); return {time, token:r.token, principals:n}; }
  if(action==='vote'){
    if(!p.t) throw new Error('請用您的報到卡 QR Code 開啟投票頁');
    const r=byTok(p.t), t=db.topics.find(x=>x.id===String(p.topic));
    if(!t) throw new Error('找不到這個議題'); if(t.status!=='open') throw new Error('此議題目前未開放投票');
    if(r.delegate) throw new Error('本戶已委託他人出席，投票由受託人辦理');
    if(!C[r.seq]) throw new Error('請先完成報到才能投票');
    if(p.v!=='同意' && p.v!=='不同意') throw new Error('請選擇同意或不同意');
    const V=db.votes[t.id]=db.votes[t.id]||{}; if(V[r.seq]) throw new Error('您已經投過這個議題，不能更改');
    const time=now(); let n=0;
    [r,...principalsOf(r.seq).filter(x=>C[x.seq]&&C[x.seq].via===r.seq)].forEach(x=>{ if(!V[x.seq]){ V[x.seq]={v:p.v,by:r.seq,time}; n++; } });
    dbSave(db); return {count:n}; }
  if(action==='evote'){
    if(!p.t) throw new Error('請用您的報到卡 QR Code 開啟投票頁');
    const r=byTok(p.t), e=findEl(p.eid);
    if(e.status!=='open') throw new Error('這場選舉目前未開放投票');
    if(r.delegate) throw new Error('本戶已委託他人出席，投票由受託人辦理');
    if(!C[r.seq]) throw new Error('請先完成報到才能投票');
    const picks=(p.picks||[]).map(String);
    if(!picks.length) throw new Error('請至少圈選 1 位');
    if(picks.length>e.maxVotes) throw new Error('每人最多圈選 '+e.maxVotes+' 位');
    if(new Set(picks).size!==picks.length) throw new Error('同一位候選人只能圈選一次');
    const cand=new Set(R.filter(h=>inG(h,e)).map(h=>h.seq)); const bad=picks.find(x=>!cand.has(x)); if(bad) throw new Error(bad+' 不是這場選舉的候選人');
    const V=db.evotes[e.id]=db.evotes[e.id]||{}, left=mine(r).filter(h=>inG(h,e)&&!V[h.seq]);
    if(!left.length) throw new Error('您已經投過這場選舉，或沒有這場選舉的投票資格');
    const time=now(); left.forEach(h=>V[h.seq]={picks,by:r.seq,time}); dbSave(db); return {count:left.length}; }
  if(action==='show'){ const code=String(p.code||''); if(!code || (code!==String(db.config.showPwd||'') && code!==String(db.config.adminPwd))) throw new Error('投影密碼錯誤');
    return buildShowData({config:db.config,residents:R,checkins:C,topics:db.topics,votes:db.votes,elections:db.elections,evotes:db.evotes}); }
  if(p.pwd !== db.config.adminPwd) throw new Error('管理密碼錯誤');
  if(action==='setShowView'){ db.config.showView=String(p.view||'auto'); dbSave(db); return {}; }
  if(action==='admin'){ const {adminPwd,showPwd,...cfg}=db.config; cfg.hasShowPwd=!!showPwd; let ck=C;
    if(p.nosig){ ck={}; Object.entries(C).forEach(([k,v])=>{ const {sig,...o}=v; ck[k]=o; }); }
    return {config:{...cfg,open:!!cfg.open}, residents:R, checkins:ck, topics:db.topics, votes:db.votes, elections:db.elections, evotes:db.evotes}; }
  if(action==='saveConfig'){ const c=p.config; Object.assign(db.config,{name:c.name,meeting:c.meeting,title:c.title,date:c.date,denom:c.denom,mode:c.mode,voteBy:c.voteBy}); if(c.showPwd!==undefined) db.config.showPwd=c.showPwd; if(c.newPwd) db.config.adminPwd=c.newPwd; dbSave(db); return {}; }
  if(action==='setOpen'){ db.config.open=!!p.open; dbSave(db); return {}; }
  if(action==='setVoteBy'){ db.config.voteBy=p.voteBy==='count'?'count':'ratio'; dbSave(db); return {}; }
  if(action==='import'){
    const keep={}; if(!p.clearCheckins) R.forEach(r=>keep[r.seq]=r.delegate||'');
    const list=p.residents.map(r=>({seq:r.seq,name:r.name,ratio:r.ratio,delegate:p.hasDelegate?(r.delegate||''):(keep[r.seq]||''),group:String(r.group||'').trim()}));
    checkDelegates(list);
    db.residents=giveTokens(list, p.clearCheckins?null:R); db.config.denom=p.denom||'';
    if(p.clearCheckins){ db.checkins={}; db.votes={}; db.evotes={}; db.topics.forEach(t=>t.status='pending'); db.elections.forEach(e=>e.status='pending'); }
    dbSave(db); return {}; }
  if(action==='regen'){ db.residents=giveTokens(R.map(({token,...r})=>r), null); dbSave(db); return {}; }
  if(action==='revoke'){ const gone=Object.keys(C).filter(s=>s===p.seq||C[s].via===p.seq); gone.forEach(s=>delete C[s]); dropVotes(gone); dbSave(db); return {}; }
  if(action==='clear'){ db.checkins={}; db.votes={}; db.evotes={}; db.topics.forEach(t=>t.status='pending'); db.elections.forEach(e=>e.status='pending'); dbSave(db); return {}; }
  if(action==='addElection'){ const name=String(p.name||'').trim(); if(!name) throw new Error('請輸入選舉名稱');
    const mv=parseInt(p.maxVotes,10), top=parseInt(p.top,10)||20; if(!(mv>=1)) throw new Error('每人票數至少 1 票');
    const id=String(db.elections.reduce((m,x)=>Math.max(m,parseInt(x.id,10)||0),0)+1);
    db.elections.push({id,name,groups:(p.groups||[]).filter(Boolean),maxVotes:mv,top,status:'pending',sort:p.sort==='ratio'?'ratio':'count'}); dbSave(db); return {id}; }
  if(action==='setElection'){ const e=findEl(p.id), f=p.fields||{}, has=Object.keys(db.evotes[e.id]||{}).length>0;
    if(has&&(f.groups!==undefined||f.maxVotes!==undefined)) throw new Error('已有人投票，不能再修改範圍或每人票數');
    if(f.name!==undefined){ if(!String(f.name).trim()) throw new Error('請輸入選舉名稱'); e.name=String(f.name).trim(); }
    if(f.groups!==undefined) e.groups=(f.groups||[]).filter(Boolean);
    if(f.maxVotes!==undefined){ const mv=parseInt(f.maxVotes,10); if(!(mv>=1)) throw new Error('每人票數至少 1 票'); e.maxVotes=mv; }
    if(f.top!==undefined){ const t=parseInt(f.top,10); if(!(t>=1)) throw new Error('取前幾名至少 1'); e.top=t; }
    if(f.status!==undefined){ if(!['pending','open','closed'].includes(f.status)) throw new Error('狀態錯誤'); e.status=f.status; }
    if(f.sort!==undefined) e.sort=f.sort==='ratio'?'ratio':'count';
    dbSave(db); return {}; }
  if(action==='delElection'){ const e=findEl(p.id); if(Object.keys(db.evotes[e.id]||{}).length) throw new Error('已有人投票，不能刪除');
    db.elections=db.elections.filter(x=>x!==e); dbSave(db); return {}; }
  if(action==='importTopics'){ const ids=new Set();
    db.topics=p.topics.filter(t=>String(t.title||'').trim()).map((t,i)=>{ const id=String(t.id||i+1).trim(); if(ids.has(id)) throw new Error('議題編號重複：'+id); ids.add(id);
      return {id,title:String(t.title).trim(),desc:String(t.desc||'').trim(),pass:String(t.pass||'').trim(),status:'pending'}; });
    db.votes={}; dbSave(db); return {}; }
  if(action==='addTopic'){ const title=String(p.title||'').trim(); if(!title) throw new Error('請輸入議題名稱');
    const id=String(db.topics.reduce((m,x)=>Math.max(m,parseInt(x.id,10)||0),0)+1); db.topics.push({id,title,desc:String(p.desc||'').trim(),pass:String(p.pass||'').trim(),status:'pending'}); dbSave(db); return {id}; }
  if(action==='setPass'){ const t=db.topics.find(x=>x.id===String(p.id)); if(!t) throw new Error('找不到這個議題'); t.pass=String(p.pass||'').trim(); dbSave(db); return {}; }
  if(action==='setTopic'){ const t=db.topics.find(x=>x.id===String(p.id)); if(!t) throw new Error('找不到這個議題'); if(!['pending','open','closed'].includes(p.status)) throw new Error('狀態錯誤'); t.status=p.status; dbSave(db); return {}; }
  if(action==='setDelegate'){ const r=bySeq(p.seq), del=p.delegate||''; if(!r) throw new Error('找不到 '+p.seq);
    if(del){ const d=bySeq(del); if(!d) throw new Error('找不到受託戶 '+del); if(d.seq===r.seq) throw new Error('不能委託給自己');
      if(d.delegate) throw new Error(`${d.seq} ${d.name} 本身已委託他人，不能再當受託戶`);
      if(principalsOf(r.seq).length) throw new Error(`${r.seq} ${r.name} 已經是其他戶的受託戶，不能再委託出去`);
      if(C[r.seq] && !C[r.seq].via) throw new Error(`${r.seq} ${r.name} 已自行報到，請先到「報到名單」撤銷`); }
    if(C[r.seq] && C[r.seq].via && C[r.seq].via!==del){ delete C[r.seq]; dropVotes([r.seq]); }
    r.delegate=del;
    if(del && C[del] && !C[r.seq]) C[r.seq]={mode:'委託',rel:PROXY_REL,sig:C[del].sig,time:now(),via:del};
    dbSave(db); return {}; }
  throw new Error('未知的動作');
}
async function call(action, payload={}){
  if(DEMO){ await new Promise(r=>setTimeout(r,120)); return demoCall(action, payload); }
  let res;
  try{ res = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})}); }
  catch(e){ throw new Error('網路連線失敗，請確認手機有網路後再試一次'); }
  const j = await res.json().catch(()=>({ok:false,msg:'伺服器回應格式錯誤'}));
  if(!j.ok) throw new Error(j.msg||'發生錯誤');
  return j;
}

/* ---------------- 手寫簽名板 ---------------- */
function SigPad(canvas, onChange){
  const ctx = canvas.getContext('2d'); let drawing=false, last=null, pts=0, box=null, w=0;
  function setup(){ const r=canvas.getBoundingClientRect(); if(Math.abs(r.width-w)<2 && w) return; w=r.width; const d=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*d); canvas.height=Math.round(r.height*d); ctx.setTransform(d,0,0,d,0,0);
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111'; ctx.fillStyle='#111'; ctx.lineWidth=2.8; clear(); }
  function clear(){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.restore(); pts=0; box=null; onChange&&onChange(false); }
  function pos(e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
  function grow(p){ if(!box) box={x0:p.x,y0:p.y,x1:p.x,y1:p.y}; box.x0=Math.min(box.x0,p.x); box.y0=Math.min(box.y0,p.y); box.x1=Math.max(box.x1,p.x); box.y1=Math.max(box.y1,p.y); }
  canvas.addEventListener('pointerdown',e=>{ e.preventDefault(); canvas.setPointerCapture(e.pointerId); drawing=true; last=pos(e); grow(last);
    ctx.beginPath(); ctx.arc(last.x,last.y,1.4,0,Math.PI*2); ctx.fill(); pts++; onChange&&onChange(true); });
  canvas.addEventListener('pointermove',e=>{ if(!drawing) return; e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for(const ev of evs){ const p=pos(ev); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; grow(p); pts++; } });
  const end=()=>{ drawing=false; }; canvas.addEventListener('pointerup',end); canvas.addEventListener('pointercancel',end); canvas.addEventListener('pointerleave',end);
  setup(); const onR=()=>{ if(!canvas.isConnected) return removeEventListener('resize',onR); if(!pts) setup(); }; addEventListener('resize',onR);
  return {
    clear, isEmpty:()=>pts<6,
    toPNG(){ // 裁切空白、縮小後輸出透明背景 PNG
      const d=window.devicePixelRatio||1, pad=6;
      const sx=Math.max(0,(box.x0-pad)*d), sy=Math.max(0,(box.y0-pad)*d);
      const sw=Math.min(canvas.width-sx,(box.x1-box.x0+pad*2)*d), sh=Math.min(canvas.height-sy,(box.y1-box.y0+pad*2)*d);
      for(const maxW of [520,420,320,240]){
        const k=Math.min(1, maxW/sw, (maxW*0.4)/sh); const o=document.createElement('canvas');
        o.width=Math.max(1,Math.round(sw*k)); o.height=Math.max(1,Math.round(sh*k));
        o.getContext('2d').drawImage(canvas,sx,sy,sw,sh,0,0,o.width,o.height);
        const url=o.toDataURL('image/png'); if(url.length<45000) return url;
      }
      throw new Error('簽名圖檔過大，請清除後再簽一次');
    }
  };
}

async function pollNow(manual){
  try{ const info=await call('public',{t:S.token}); S.info=info;
    if(!info.me||!info.me.done||info.me.delegate){ stopPoll(); renderCheckin(); return; }
    const box=$('#votes'); if(box && !S.voting) box.innerHTML=votesHTML();
    const eb=$('#elects'), sig=elSig(); if(eb && (manual || sig!==S.elSig) && !eb.contains(document.activeElement)) eb.innerHTML=electsHTML();
    if(manual) toast('已更新'); }
  catch(e){ if(manual) toast(e.message); }
}
const elSig=()=>JSON.stringify(((S.info.me||{}).elections||[]).map(e=>[e.id,e.weight,e.picks,e.maxVotes]));
const myEl=id=>((S.info.me||{}).elections||[]).find(e=>e.id===id);
function electsHTML(){ S.elSig=elSig(); const els=(S.info.me||{}).elections||[];
  return els.map(e=>{ const nm=seq=>{ const c=e.candidates.find(x=>x.seq===seq); return c?`${c.seq} ${c.name}`:seq; };
    if(e.picks) return `<div class="card"><h2>${esc(e.name)}</h2><div class="voted y">✓ 已投票${e.total>1?`（代表 ${e.total} 戶）`:''}</div>
      <p class="hint" style="margin-top:10px">您圈選：${e.picks.map(x=>esc(nm(x))).join('、')}</p></div>`;
    const st=S.ev[e.id]=S.ev[e.id]||{picks:[],q:''};
    return `<div class="card" id="ec_${esc(e.id)}"><h2>${esc(e.name)}</h2>
      <div class="hint" style="margin:0 0 10px">每戶最多圈選 <b>${e.maxVotes}</b> 位${e.groups.length?`・範圍：${esc(e.groups.join('、'))}`:''}</div>
      ${e.weight>1?`<div style="background:var(--pri2);border-radius:10px;padding:9px 12px;font-size:15px;margin-bottom:10px">您的選票代表 <b>${e.weight} 戶</b>（本戶＋委託您出席的戶）</div>`:''}
      <div id="ep_${esc(e.id)}">${evPicked(e)}</div>
      <input class="inp" placeholder="搜尋候選人序號或姓名" value="${esc(st.q)}" autocomplete="off" oninput="evQ('${esc(e.id)}',this.value)" style="margin-top:10px">
      <div class="list" id="cl_${esc(e.id)}" style="max-height:340px">${evList(e)}</div></div>`; }).join(''); }
function evPicked(e){ const st=S.ev[e.id], nm=seq=>{ const c=e.candidates.find(x=>x.seq===seq); return c?`${c.seq} ${c.name}`:seq; };
  return `<div style="font-size:15px;margin-bottom:6px">已選 <b>${st.picks.length}</b> / ${e.maxVotes} 位</div>
    <div>${st.picks.map(x=>`<span class="chip" style="background:var(--pri2);color:var(--pri)">${esc(nm(x))}<button onclick="evToggle('${esc(e.id)}','${esc(x)}')">×</button></span>`).join('')||'<span class="hint">請從下方名單勾選</span>'}</div>
    <button class="btn pri big" style="margin-top:10px" onclick="castEvote('${esc(e.id)}')" ${st.picks.length?'':'disabled'}>送出選票（已選 ${st.picks.length} 位）</button>`; }
function evList(e){ const st=S.ev[e.id], q=st.q.trim().toLowerCase(), full=st.picks.length>=e.maxVotes;
  const list=e.candidates.filter(c=>!q||c.seq.toLowerCase().includes(q)||c.name.toLowerCase().includes(q));
  return list.length?list.map(c=>{ const on=st.picks.includes(c.seq);
    return `<button class="${on?'pk':''}" ${!on&&full?'disabled':''} onclick="evToggle('${esc(e.id)}','${esc(c.seq)}')"><span>${on?'☑':'☐'}　${esc(c.seq)}　${esc(c.name)}</span>${c.group?`<span class="tag">${esc(c.group)}</span>`:''}</button>`; }).join('')
    :'<div style="padding:14px;color:#a0a8a5">找不到符合的候選人</div>'; }
function evQ(id,v){ const e=myEl(id); if(!e) return; S.ev[id].q=v; $('#cl_'+id).innerHTML=evList(e); }
function evToggle(id,seq){ const e=myEl(id); if(!e) return; const st=S.ev[id], i=st.picks.indexOf(seq);
  if(i>=0) st.picks.splice(i,1); else if(st.picks.length<e.maxVotes) st.picks.push(seq); else return toast(`最多圈選 ${e.maxVotes} 位`);
  const l=$('#cl_'+id), y=l.scrollTop; l.innerHTML=evList(e); l.scrollTop=y; $('#ep_'+id).innerHTML=evPicked(e); }
async function castEvote(id){ const e=myEl(id); if(!e) return; const st=S.ev[id];
  const names=st.picks.map(x=>{ const c=e.candidates.find(y=>y.seq===x); return c?`${c.seq} ${c.name}`:x; });
  if(!confirm(`${e.name}\n\n您圈選了 ${names.length} 位：\n${names.join('\n')}${e.weight>1?`\n\n（這張選票代表 ${e.weight} 戶）`:''}\n\n送出後不能更改，確定送出嗎？`)) return;
  try{ const r=await call('evote',{t:S.token,eid:id,picks:st.picks}); delete S.ev[id]; toast(`已投票（${r.count} 戶）`); await pollNow(false); $('#elects').innerHTML=electsHTML(); }
  catch(e2){ alert(e2.message); await pollNow(false); } }
function startPoll(){ stopPoll(); S.poll=setInterval(()=>{ if(document.visibilityState==='visible') pollNow(false); },15000); }
function stopPoll(){ if(S.poll) clearInterval(S.poll); S.poll=null; }
document.addEventListener('visibilitychange',()=>{ if(S.poll && document.visibilityState==='visible') pollNow(false); });
async function castVote(id, v){
  const t=(S.info.topics||[]).find(x=>x.id===id); const w=1+S.info.me.principals.filter(p=>p.done).length;
  if(!confirm(`第 ${id} 案：${t?t.title:''}\n\n確定投下「${v}」嗎？${w>1?`\n（代表 ${w} 戶）`:''}\n\n送出後不能更改。`)) return;
  S.voting=true; $('#votes').innerHTML=votesHTML();
  try{ const r=await call('vote',{t:S.token, topic:id, v}); S.voting=false; toast(`已投票（${r.count} 票）`); await pollNow(false); }
  catch(e){ S.voting=false; alert(e.message); await pollNow(false); }
}
function drawList(){
  const q=S.q.trim().toLowerCase(), box=$('#lst'); if(!box) return;
  if(!q){ box.innerHTML=`<div style="padding:14px;color:#a0a8a5;font-size:15px">請先輸入序號或姓名搜尋</div>`; return; }
  const hits=S.info.residents.filter(r=>r.seq.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)).slice(0,40);
  box.innerHTML = hits.length ? hits.map(r=>`<button ${r.done||r.delegate?'disabled':''} onclick="pick('${esc(r.seq)}')"><span>${esc(r.seq)}　${esc(r.name)}</span>${r.done?'<span class="tag ok">已報到</span>':r.delegate?`<span class="tag px">已委託 ${esc(r.delegate)}</span>`:'<span class="tag">選擇</span>'}</button>`).join('')
    : `<div style="padding:14px;color:#a0a8a5;font-size:15px">找不到符合的住戶，請洽報到處</div>`;
}
function pick(seq){ S.err=''; S.sel = seq ? S.info.residents.find(r=>r.seq===seq) : null; if(!seq) S.q=''; rerender(); }
function setMode(m){ S.mode=m; if(m==='本人') S.rel=null; S.err=''; rerender(); }
function setRel(r){ S.rel=r; S.err=''; rerender(); }
let savedSig=null;
function rerender(){ // 重繪畫面時保留已簽好的名
  if(S.pad && !S.pad.isEmpty()){ try{ savedSig={png:S.pad.toPNG()}; }catch(e){} }
  const y=scrollY; renderCheckin(); scrollTo(0,y);
  if(savedSig && $('.sigbox')) showSavedSig();
}
function showSavedSig(){ // 已簽好的名以圖片顯示，可清除重簽
  const box=$('.sigbox'); box.innerHTML=`<div style="height:210px;display:grid;place-items:center"><img src="${savedSig.png}" style="max-width:90%;max-height:180px"></div>`;
  box.nextElementSibling.querySelector('button').onclick=()=>{ savedSig=null; renderCheckin(); };
}
function resetCheckin(){ stopPoll(); if(S.info.mode==='shared'){ S.token=''; history.replaceState(null,'',location.pathname); }
  Object.assign(S,{sel:null,mode:null,rel:null,q:'',err:'',just:null}); savedSig=null; startCheckin(); }
async function submitCheckin(){
  const miss=[];
  if(!S.sel) miss.push('戶別'); if(!S.mode) miss.push('是否委託出席'); if(S.mode==='委託'&&!S.rel) miss.push('委託關係');
  const hasSig = savedSig || (S.pad && !S.pad.isEmpty()); if(!hasSig) miss.push('簽名');
  if(miss.length){ S.err='尚未完成：'+miss.join('、'); rerender(); scrollTo({top:0,behavior:'smooth'}); return; }
  let sig; try{ sig = savedSig ? savedSig.png : S.pad.toPNG(); }catch(e){ S.err=e.message; rerender(); return; }
  savedSig={png:sig}; S.busy=true; S.err=''; rerender();
  try{ const r = await call('checkin',{t:S.token, seq:S.sel.seq, mode:S.mode, rel:S.rel||'', sig});
    S.just={mode:S.mode,rel:S.rel,time:r.time}; S.busy=false; savedSig=null;
    if(!S.token && r.token){ S.token=r.token; history.replaceState(null,'','?t='+encodeURIComponent(r.token)); }  // 共用 QR 模式：記住身分以便投票
    S.info = await call('public',{t:S.token}); renderCheckin(); scrollTo(0,0);
  }catch(e){ S.busy=false; S.err=e.message; rerender(); scrollTo({top:0,behavior:'smooth'}); }
}

function adminLogin(err){
  $('#app').innerHTML=`<div class="wrap"><div class="hero"><h1>區權會報到系統</h1><p>管理者登入</p></div>
   ${DEMO?'<div class="demo">示範模式預設密碼：1234（登入後可在「會議設定」修改）</div>':''}
   ${err?`<div class="err">${esc(err)}</div>`:''}
   <div class="card"><label class="f" style="margin-top:0">管理密碼</label><input class="inp" type="password" id="pw" onkeydown="if(event.key==='Enter')doLogin()">
   <button class="btn pri big" style="margin-top:14px" onclick="doLogin()">登入</button></div>
   <div class="foot"><a href="?">← 回到住戶報到頁</a></div></div>`;
  setTimeout(()=>$('#pw')&&$('#pw').focus(),50);
}
async function doLogin(){ A.pwd=$('#pw').value; await loadAdmin(true); }
async function loadAdmin(first){
  try{ A.data = await call('admin',{pwd:A.pwd}); A.upd=new Date(); sessionStorage.setItem('agm_pwd',A.pwd); }
  catch(e){ if(first||/密碼/.test(e.message)){ sessionStorage.removeItem('agm_pwd'); adminLogin(A.pwd?e.message:''); } else toast(e.message); return false; }
  renderAdmin(); return true;
}
function stats(D){
  const {config,residents,checkins}=D||A.data;
  const total=residents.length, sumAll=residents.reduce((s,r)=>s+num(r.ratio),0);
  const denom = config.denom ? num(config.denom) : sumAll;
  let att=0,self=0,proxy=0,sumAtt=0;
  residents.forEach(r=>{ const c=checkins[r.seq]; if(c){ att++; c.mode==='本人'?self++:proxy++; sumAtt+=num(r.ratio);} });
  return {total,att,self,proxy,sumAtt,denom,denomStr:config.denom||fmtNum(sumAll)};
}

async function fetchAdmin(light){ // light：不重抓簽名圖，沿用手上已有的，減少流量

  if(light && A.data) for(const [k,v] of Object.entries(d.checkins)){ const o=A.data.checkins[k]; if(o&&o.sig&&o.time===v.time) v.sig=o.sig; }

async function autoRefresh(){
  if(!A.data || !$('#pv').hidden || document.querySelector('div[style*="position:fixed"]')) return;
  if(!['live','status','vote','elect','detail'].includes(A.tab)) return;
  const typing = document.activeElement && document.activeElement.tagName==='INPUT';
  try{ await fetchAdmin(true); if(A.tab==='status' && needSig()) await fetchAdmin(false); }catch(e){ return; }
  if(A.tab==='live' && $('#live')){ $('#live').innerHTML=liveHTML(); $('#vctl').innerHTML=voteCtlHTML(); drawLQ(); }

function tally(tid,D){ D=D||A.data; const {residents,votes}=D, V=(votes||{})[tid]||{}, st=stats(D);
  const o={y:0,yr:0,n:0,nr:0,attN:st.att,attR:st.sumAtt,total:st.total,denom:st.denom};
  residents.forEach(r=>{ const v=V[r.seq]; if(!v) return; if(v.v==='同意'){o.y++;o.yr+=num(r.ratio);} else {o.n++;o.nr+=num(r.ratio);} });
  o.uN=Math.max(0,o.attN-o.y-o.n); o.uR=Math.max(0,o.attR-o.yr-o.nr); return o; }

const inGrp=(h,e)=>!e.groups.length||e.groups.includes(h.group||'');
function etally(e,D){ const {residents:R,checkins,evotes}=D||A.data, V=(evotes||{})[e.id]||{}, by={}; R.forEach(r=>by[r.seq]=r);
  const m={}; R.filter(h=>inGrp(h,e)).forEach(c=>m[c.seq]={c,v:0,r:0});
  let nv=0, nvr=0; Object.entries(V).forEach(([seq,x])=>{ nv++; const w=by[seq]?num(by[seq].ratio):0; nvr+=w; x.picks.forEach(p=>{ if(m[p]){ m[p].v++; m[p].r+=w; } }); });
  const R2=e.sort==='ratio', key=x=>R2?Math.round(x.r*1e4)/1e4:x.v, k2=x=>R2?x.v:Math.round(x.r*1e4)/1e4;
  const list=Object.values(m).filter(x=>x.v>0).sort((a,b)=>key(b)-key(a)||k2(b)-k2(a)||natCmp(a.c.seq,b.c.seq));
  list.forEach((x,i)=>{ x.rank = i&&key(list[i-1])===key(x) ? list[i-1].rank : i+1; });
  const tie = list.length>e.top && key(list[e.top-1])===key(list[e.top]), cutK = list.length>=e.top ? key(list[e.top-1]) : null;
  // 結果標記：確定進入前 N 名 → win；與第 N 名同票、超出名額 → tie
  list.forEach(x=>{ x.res = x.rank>e.top ? '' : (tie && key(x)===cutK) ? 'tie' : 'win'; });
  return {list,nv,nvr,tie,key,elig:R.filter(h=>inGrp(h,e)&&checkins[h.seq]).length,gTotal:R.filter(h=>inGrp(h,e)).length,cand:Object.keys(m).length}; }

      <div class="grid2" style="margin-top:12px"><button class="btn pri" onclick="saveEl('${id}',${has})">儲存</button>${has?'':`<button class="btn bad" onclick="delEl('${id}')">刪除這場選舉</button>`}</div>
    </details></div>`; }

    t.rows.forEach(r=>{ if(used+r.h>CAP && rows.length){ flush(); np(); if(t.cont){ cur.push(`<div class="rcont">${t.cont}（續）</div>`); used+=6; } used+=t.headH; } rows.push(r.html.replace('<tr',`<tr style="height:${r.h}mm"`)); used+=r.h; });
    flush(); used+=b.gap??5;
  });
  np(); const N=pages.length;
  return pages.map((p,i)=>`<div class="page rpt">${p.join('')}<div class="pn">第${i+1}頁，共${N}頁</div></div>`).join('');
}
const colg=ws=>`<colgroup>${ws.map(w=>`<col style="width:${w}%">`).join('')}</colgroup>`;
function rptHead(sub){ const c=A.data.config; return {h:21,html:`<div class="ttl">${esc((c.name||'')+mtg(c))}　${sub}</div><div class="dt">會議日期：${esc(rocDate(c.date))}</div>`}; }
function rptAttend(){ const st=stats(), vb=voteBy(A.data.config);
  return {h:24,html:`<table class="rs"><tr><th>應出席</th><td>${st.total} 戶・區分所有權比例 ${esc(st.denomStr)}</td></tr>
    <tr><th>出席</th><td>${st.att} 戶（${pct(st.att,st.total)}）・區分所有權比例 ${fmtNum(st.sumAtt)}（${pct(st.sumAtt,st.denom)}）・其中委託出席 ${st.proxy} 戶</td></tr>
    <tr><th>計票方式</th><td>${VB_TXT[vb]}（百分比以出席為分母）</td></tr></table>`}; }
const rptSign=()=>({h:34,html:`<div class="sgn"><span>主席：</span><span>記錄：</span><span>監票：</span></div><div class="note">列印時間：${esc(new Date().toLocaleString('zh-TW',{hour12:false}))}</div>`});

function printTopics(){
  const T=A.data.topics||[], V=A.data.votes||{}, R=A.data.residents, C=A.data.checkins, vb=voteBy(A.data.config), withD=$('#px_vd')&&$('#px_vd').checked;
  const stTxt={pending:'未開放',open:'投票中',closed:'已結束'};
  const blocks=[rptHead('議題表決結果'), rptAttend()];
  const rows=T.map(t=>{ const x=tally(t.id), J=judge(x,t,vb), R2=vb==='ratio';
    const cell=(c,r,base)=>`${c} 票<br>${fmtNum(r)}<br><b>${pct(R2?r:c,R2?x.attR:x.attN)}</b>`;
    const res=t.status==='closed'?(J.ok?'<b class="ok">通過</b>':'<b class="bad">未通過</b>'):t.status==='open'?'投票中':'未表決';
    const h=Math.max(17, estH(t.title,RW*0.30,10.5)+(t.desc?estH(t.desc,RW*0.30,8.5):0));
    return {h,html:`<tr><td>${esc(t.id)}</td><td class="l">${esc(t.title)}${t.desc?`<div class="sm">${esc(t.desc)}</div>`:''}</td><td>${esc(J.p.label)}</td>
      <td>${cell(x.y,x.yr)}</td><td>${cell(x.n,x.nr)}</td><td>${x.uN} 戶<br>${fmtNum(x.uR)}</td><td>${res}</td></tr>`}; });
  blocks.push({table:{cols:colg([7,30,13,14,14,11,11]),head:'<tr><th>案次</th><th>議題</th><th>通過門檻</th><th>同意</th><th>不同意</th><th>未投票</th><th>結果</th></tr>',headH:9,rows,cont:'議題表決結果'}});
  blocks.push({h:7,html:`<div class="note">同意／不同意欄：票數（戶）、區分所有權比例、百分比（${VB_TXT[vb]}）。</div>`,});
  blocks.push(rptSign());
  if(withD && T.length){
    const tw=Math.max(5,Math.floor(44/T.length)), first=[11,22,9,14], last=100-first.reduce((a,b)=>a+b,0)-tw*T.length;
    const ws=[...first, ...T.map(()=>tw)]; ws[1]+=last;
    const dr=R.map(r=>{ const k=C[r.seq];
      const att=k?(k.via?'委託':k.mode==='本人'?'本人':'委託'):'—';
      return {h:6.2,html:`<tr><td>${esc(r.seq)}</td><td class="l nw">${esc(r.name)}</td><td>${esc(r.ratio)}</td><td>${att}</td>${T.map(t=>{ const v=(V[t.id]||{})[r.seq];
        return `<td>${v?(v.v==='同意'?'同意':'<b>不同意</b>')+(v.by&&v.by!==r.seq?'*':''):(k?'未投':'—')}</td>`; }).join('')}</tr>`}; });
    blocks.push({newPage:true,h:16,html:`<div class="ttl" style="font-size:13pt">附件：各戶投票明細</div><div class="note">「*」表示由受託戶投票（委託出席）；「—」表示未出席。</div>`});
    blocks.push({table:{cols:colg(ws),head:`<tr><th>序號</th><th>姓名</th><th>比例</th><th>出席</th>${T.map(t=>`<th>第${esc(t.id)}案</th>`).join('')}</tr>`,headH:7,rows:dr,cont:'各戶投票明細'}});
  }
  openPV(packReport(blocks));
}
function printElections(){
  const all=A.data.elections||[], sel=[...document.querySelectorAll('.px_e:checked')].map(x=>x.value);
  const E=document.querySelectorAll('.px_e').length?all.filter(e=>sel.includes(e.id)):all;
  if(!E.length) return toast('請至少勾選一場選舉');
  const mode=(document.querySelector('[name=px_r]:checked')||{}).value||'top', withD=$('#px_ed')&&$('#px_ed').checked;
  const stTxt={pending:'未開放',open:'投票中',closed:'已結束'}, EV=A.data.evotes||{}, R=A.data.residents, nm=sq=>{ const r=R.find(x=>x.seq===sq); return r?r.name:''; };
  const blocks=[rptHead('委員選舉結果'), rptAttend()];
  E.forEach(e=>{ const x=etally(e), list=mode==='all'?x.list:x.list.filter(y=>y.res);
    const cap=`<div class="ecap"><b>${esc(e.name)}</b>　範圍：${esc(e.groups.length?e.groups.join('、'):'全體住戶')}・每戶 ${e.maxVotes} 票・取前 ${e.top} 名・排序依${e.sort==='ratio'?'得票比例':'得票數'}・狀態：${stTxt[e.status]}<br>
      候選人 ${x.cand} 位・已報到可投 ${x.elig} 戶・已投票 ${x.nv} 戶（${pct(x.nv,x.elig)}，含委託出席戶）</div>`;
    const rows=list.map(y=>({h:7,html:`<tr${y.res?' class="w"':''}><td>${y.rank}</td><td>${esc(y.c.seq)}</td><td class="l nw">${esc(y.c.name)}</td><td>${esc(y.c.group||'')}</td><td>${y.v}</td><td>${fmtNum(y.r)}</td><td>${y.res==='win'?(e.status==='closed'?'<b class="ok">當選</b>':`前 ${e.top} 名`):y.res==='tie'?'<b class="bad">同票待定</b>':''}</td></tr>`}));
    if(!rows.length) rows.push({h:7,html:'<tr><td colspan="7">尚無得票紀錄</td></tr>'});
    blocks.push({table:{caption:{h:15,html:cap},cols:colg([9,13,30,12,12,12,12]),head:'<tr><th>名次</th><th>序號</th><th>姓名</th><th>棟別</th><th>得票數</th><th>得票比例</th><th>結果</th></tr>',headH:8,rows,cont:e.name},gap:3});
    if(x.tie) blocks.push({h:8,html:`<div class="note bad">⚠ 第 ${e.top} 名有同票（${x.list.filter(y=>y.res==='tie').length} 位競爭 ${e.top-x.list.filter(y=>y.res==='win').length} 個名額），請依規約處理。</div>`});
    blocks.push({h:4,html:'<div style="height:4mm"></div>'});
  });
  blocks.push(rptSign());
  if(withD) E.forEach((e,i)=>{ const V=EV[e.id]||{}, ent=Object.entries(V).sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant',{numeric:true}));
    const rows=ent.map(([sq,v])=>{ const txt=v.picks.join('、'); return {h:estH(txt,RW*0.5,9,6.2),html:`<tr><td>${esc(sq)}</td><td class="l nw">${esc(nm(sq))}</td><td class="l">${esc(txt)}</td><td>${v.by&&v.by!==sq?esc(v.by):''}</td></tr>`}; });
    if(!rows.length) rows.push({h:7,html:'<tr><td colspan="4">尚無選票</td></tr>'});
    blocks.push({newPage:i===0,h:i===0?10:0,html:i===0?'<div class="ttl" style="font-size:13pt">附件：選票明細</div>':''});
    blocks.push({table:{caption:{h:9,html:`<div class="ecap"><b>${esc(e.name)}</b>　（圈選欄為候選人序號；「受託戶」欄有填者，表示該戶委託出席、由受託戶投票）</div>`},cols:colg([12,24,50,14]),head:'<tr><th>序號</th><th>姓名</th><th>圈選</th><th>受託戶</th></tr>',headH:7,rows,cont:'選票明細－'+e.name}});
  });
  openPV(packReport(blocks));
}
async function openSheet(){
  if(needSig()){ try{ await fetchAdmin(false); }catch(e){ return toast(e.message); } }
  const {config,residents,checkins}=A.data, st=stats();
  const FIRST=13, OTHER=14, pages=[];
  pages.push(residents.slice(0,FIRST)); for(let i=FIRST;i<residents.length;i+=OTHER) pages.push(residents.slice(i,i+OTHER));
  const cap = pages.length===1?FIRST:OTHER, ownPage = pages[pages.length-1].length > cap-3;
  const total = pages.length + (ownPage?1:0);
  const head=`<colgroup><col style="width:6.68%"><col style="width:12.19%"><col style="width:12.78%"><col style="width:15.61%"><col style="width:26.5%"><col style="width:15.85%"><col style="width:10.39%"></colgroup>
    <thead><tr><th>序<br>號</th><th>姓&nbsp;&nbsp;名</th><th>簽&nbsp;&nbsp;章</th><th>是否<br>委託出席</th><th style="text-decoration:underline">委託關係</th><th>區分所有<br>權比例</th><th>備註</th></tr></thead>`;
  const row=r=>{ const c=checkins[r.seq];
    return `<tr><td>${esc(r.seq)}</td><td>${esc(r.name)}</td><td class="sig">${c?`<img src="${c.sig}">`:''}</td>
      <td class="att">${box(c&&c.mode==='本人')}本人${box(c&&c.mode==='委託')}委託</td>
      <td class="rl">${REL.map(x=>`<div>${box(c&&c.mode==='委託'&&c.rel===x)}${x}</div>`).join('')}</td>
      <td class="rt">${esc(r.ratio)}/${esc(st.denomStr)}</td><td class="rm">${c&&c.via?`委託${esc(c.via)}<br>出席`:''}</td></tr>`; };
  const summary=`<table class="sum"><tr><th>應出席區分所有權人</th><td>${st.total} 人</td><th>區分所有權比例合計</th><td>${esc(st.denomStr)}</td></tr>
    <tr><th>出席數</th><td>${st.att} 人<br><span style="font-size:9.5pt">（本人 ${st.self} 人、委託 ${st.proxy} 人）</span></td><th>出席區分所有權比例</th><td>${fmtNum(st.sumAtt)}</td></tr>
    <tr><th>出席率（人數）</th><td>${pct(st.att,st.total)}</td><th>出席率（比例）</th><td>${pct(st.sumAtt,st.denom)}</td></tr></table>
    <div class="note">統計時間：${esc(new Date().toLocaleString('zh-TW',{hour12:false}))}</div>`;
  const title=`<div class="ttl">${esc(sheetTitle(config))}</div><div class="dt">會議日期：${esc(rocDate(config.date))}</div>`;
  let html=pages.map((p,i)=>`<div class="page">${i===0?title:''}<table class="sheet">${head}<tbody>${p.map(row).join('')}</tbody></table>
    ${(!ownPage&&i===pages.length-1)?summary:''}<div class="pn">第${i+1}頁，共${total}頁</div></div>`).join('');
  if(ownPage) html+=`<div class="page">${summary}<div class="pn">第${total}頁，共${total}頁</div></div>`;
  openPV(html);
}

/* ---------------- 啟動 ---------------- */
if(PAGE==='show'){ try{ SH.code=localStorage.getItem('agm_show_code')||sessionStorage.getItem('agm_show_code')||''; }catch(e){}
  if(SH.code) call('show',{code:SH.code}).then(d=>{ SH.data=d; startShow(); }).catch(e=>showLogin(/密碼/.test(e.message)?'':e.message)); else showLogin(); }
else if(PAGE==='admin'){ A.pwd ? loadAdmin(true) : adminLogin();
  setInterval(autoRefresh,10000); }
else startCheckin();
</script>
